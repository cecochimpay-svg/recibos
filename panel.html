  <style>
    :root {
      --color-bg: #F4F6F3;
      --color-surface: #FFFFFF;
      --color-plant: #1E6B4C;
      --color-plant-dark: #123F2C;
      --color-plant-soft: rgba(30, 107, 76, 0.08);
      --color-text: #1B231D;
      --color-text-secondary: #64748B;
      --color-border: #E2E8F0;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-family);
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #DAD4C8; border-radius: 20px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-plant); }

    /* Topbar Superior */
    .topbar {
      background: #FFFFFF;
      border-bottom: 1.5px solid var(--color-border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .user-info-header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-plant);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(30, 107, 76, 0.25);
    }

    .user-texts {
      min-width: 0;
    }

    .user-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--color-plant-dark);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .user-sub {
      font-size: 11.5px;
      color: var(--color-text-secondary);
      font-weight: 600;
      margin-top: 2px;
      white-space: nowrap;
    }

    .btn-logout {
      background: #F8FAFC;
      border: 1.2px solid var(--color-border);
      color: var(--color-text-secondary);
      padding: 7px 12px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: #FEE2E2;
      border-color: #FCA5A5;
      color: #991B1B;
    }

    button:active, .card-anio:active, .btn-action:active {
      background-color: #FFFDE7 !important;
      border-color: #FBC02D !important;
      color: #D97706 !important;
      box-shadow: inset 0 3px 8px rgba(251, 192, 45, 0.25) !important;
      transform: scale(0.97);
    }

    /* Layout Responsive */
    .layout-panel {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 18px;
      padding: 20px;
      flex: 1;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    /* Sidebar Izquierda (Años) */
    .sidebar-anios {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(20, 30, 24, 0.03);
      height: fit-content;
    }

    .sidebar-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cards-anios-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-anio {
      background: #F8FAFC;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-anio:hover {
      background: #FFFFFF;
      border-color: var(--color-plant);
      transform: translateX(2px);
    }

    .card-anio.active {
      background: var(--color-plant-soft);
      border-color: var(--color-plant);
      box-shadow: 0 3px 10px rgba(30, 107, 76, 0.12);
    }

    .card-anio-titulo {
      font-family: 'Montserrat', sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--color-plant-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-anio-cant {
      background: var(--color-plant);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
      min-width: 24px;
      text-align: center;
    }

    .card-anio.active .card-anio-cant {
      background: var(--color-plant-dark);
    }

    /* Panel Contenedor de Recibos */
    .content-recibos {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(20, 30, 24, 0.03);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1.5px solid var(--color-border);
      padding-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-titulo {
      font-family: 'Montserrat', sans-serif;
      font-size: 16.5px;
      font-weight: 800;
      color: var(--color-plant-dark);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Lista de Recibos en Formato Cards Suaves */
    .lista-recibos-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .recibo-card-item {
      background: #FFFFFF;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);

    .recibo-card-item:hover {
      border-color: var(--color-plant);
      box-shadow: 0 4px 12px rgba(30, 107, 76, 0.08);
      transform: translateY(-1px);
    }

    .recibo-datos-izq {

      flex-direction: column;
      gap: 4px;
      min-width: 0;

    .recibo-mes-nombre {

      font-size: 15px;
      font-weight: 800;
      color: var(--color-plant-dark);

    .recibo-meta-flex {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11.5px;

    .badge-legajo {
      background: #F1F5F9;
      color: var(--color-text);
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--color-border);

    .badge-periodo-sub {
      color: var(--color-text-secondary);
      font-weight: 600;

    /* Badges de Firma */
    .badge-firmado {
      background: #DEF7EC;
      color: #03543F;
      border: 1px solid #BCF0DA;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .badge-pendiente {
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #FDE68A;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Botones de Acción */
    .recibo-acciones-der {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-action {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
      border: none;
    }

    .btn-ver {
      background: #F8FAFC;
      border: 1.2px solid var(--color-border);
      color: var(--color-text);
    }
    .btn-ver:hover {
      background: #E2E8F0;
      border-color: #CBD5E1;
    }

    .btn-descargar {
      background: var(--color-plant);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(30, 107, 76, 0.2);
    }
    .btn-descargar:hover {
      background: var(--color-plant-dark);
    }

    .empty-state {
      text-align: center;
      padding: 45px 20px;
      color: var(--color-text-secondary);
      font-weight: 600;
      font-size: 13px;
    }

    /* Modal de Firma Digital */
    .modal-overlay-firma {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 16px;
    }

    .modal-firma-card {
      background: #FFFFFF;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 22px;
      border: 1.5px solid var(--color-border);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: entrar 0.2s ease forwards;
    }

    @keyframes entrar {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .canvas-box {
      border: 1.5px dashed var(--color-plant);
      border-radius: 12px;
      background: #FAFBF9;
      position: relative;
      touch-action: none;
      user-select: none;
      width: 100%;
      height: 190px;
    }

    #canvasFirma {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .linea-guia-firma {
      position: absolute;
      bottom: 25px;
      left: 20px;
      right: 20px;
      border-bottom: 1px dashed #CBD5E1;
      pointer-events: none;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding-bottom: 3px;
    }

    /* Adaptación para pantallas pequeñas (Celulares) */
    @media (max-width: 768px) {
      .layout-panel {
        grid-template-columns: 1fr;
        padding: 14px;
        gap: 14px;
      }

      .topbar {
        padding: 10px 14px;
      }

      .user-name {
        max-width: 170px;
      }

      .sidebar-anios {
        padding: 12px;
      }

      .cards-anios-container {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .card-anio {
        flex-shrink: 0;
        padding: 7px 12px;
        gap: 8px;
      }

      .recibo-card-item {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .recibo-acciones-der {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .btn-action {
        justify-content: center;
        padding: 9px;
      }
    }
  </style>
</head>

  <script>
        // 1. Bloquear atajos de teclado
  window.addEventListener('keydown', function(e) {
    var isCtrlOrCmd = e.ctrlKey || e.metaKey;
    var key = e.key ? e.key.toLowerCase() : '';
    
    // F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+U
    if (e.key === 'F12' || 
       (isCtrlOrCmd && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) ||
       (isCtrlOrCmd && key === 'u')) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);

  // 2. Bloquear Clic Derecho (Menú Contextual)
  window.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  }, true);

  // 3. Detección Inteligente de DevTools Abiertas
  function detectDevTools() {
    var widthThreshold = window.outerWidth - window.innerWidth > 160;
    var heightThreshold = window.outerHeight - window.innerHeight > 160;
    
    // Si la consola está acoplada al costado o abajo
    if (widthThreshold || heightThreshold) {
      bloquearPantalla();
    }
  }

  // 4. Trampa Anti-Debugging (Pausa la ejecución si la consola se abre)
  setInterval(function() {
    var startTime = performance.now();
    debugger;
    var endTime = performance.now();
    if (endTime - startTime > 100) {
      bloquearPantalla();
    }
    detectDevTools();
  }, 500);

  function bloquearPantalla() {
    document.body.innerHTML = `
      <div style="display:flex; height:100vh; align-items:center; justify-content:center; background-color:#F4F6F3; font-family:sans-serif;">
        <div style="text-align:center; padding:30px; background:#fff; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08);">
          <h2 style="color:#991B1B; margin-bottom:10px;">Acceso restringido</h2>
          <p style="color:#4B5563;">Por razones de seguridad, cerrá las herramientas de desarrollo para continuar.</p>
        </div>
      </div>
    `;
  }
    const SUPABASE_URL = 'https://zsgqlmfzidazdtpgmuna.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZ3FsbWZ6aWRhemR0cGdtdW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMTY3NDIsImV4cCI6MjA5Nzc5Mjc0Mn0.Y9dDHLdQGIOcVS3JaYnbUHWlwul4uiEkkb7udeoF-b0';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let sesionActual = null;
    let todosLosRecibos = [];
    let anioSeleccionado = '';
    let operacionPendiente = null;

    // Variables Canvas
    let canvas = null;
    let ctx = null;
    let dibujando = false;
    let trazoRealizado = false;

    const NOMBRES_MESES = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const sesionStorage = localStorage.getItem('operario_sesion');
      if (!sesionStorage) {
        window.location.href = 'index.html';
        return;
      }

      sesionActual = JSON.parse(sesionStorage);

      // Cabecera
      document.getElementById('lblEmpleado').innerText = sesionActual.empleado || 'Operario';
      document.getElementById('lblDni').innerText = sesionActual.dni;
      document.getElementById('lblLegajo').innerText = `#${sesionActual.legajo || '—'}`;
      document.getElementById('avatarLetra').innerText = (sesionActual.empleado ? sesionActual.empleado[0] : 'O').toUpperCase();

      inicializarCanvas();
      cargarRecibosOperario();
    });

    // 1. Cargar Recibos
    async function cargarRecibosOperario() {
      try {
        const { data, error } = await supabaseClient
          .from('recibos')
          .select('*')
          .eq('dni', parseInt(sesionActual.dni, 10))
          .order('periodo', { ascending: false });

        if (error) throw error;

        todosLosRecibos = data || [];

        if (todosLosRecibos.length === 0) {
          document.getElementById('contenedorCardsAnios').innerHTML = '<div style="font-size:12px; color:var(--color-text-secondary); padding:6px;">Sin ejercicios.</div>';
          document.getElementById('contenedorRecibosLista').innerHTML = '<div class="empty-state">No se encontraron recibos emitidos para este DNI.</div>';
          return;
        }

        renderizarCardsAnios();

      } catch (err) {
        console.error("Error cargando recibos:", err);
        document.getElementById('contenedorRecibosLista').innerHTML = `<div class="empty-state" style="color:#DC2626;">Error al consultar recibos: ${err.message}</div>`;
      }
    }

    // ESTO LO MODIFIQUE: Coordenadas milimétricas según el formato de recibo de CECO S.A.
async function estamparFirmaEnPdf(pdfBlobOriginal, pngBlobFirma, periodo = '') {
  const pdfBytes = await pdfBlobOriginal.arrayBuffer();
  const pngBytes = await pngBlobFirma.arrayBuffer();

  const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
  const firmaImg = await pdfDoc.embedPng(pngBytes);
  const paginas = pdfDoc.getPages();
  const primeraPagina = paginas[0];

  const { width, height } = primeraPagina.getSize();

  // Tamaño proporcional del trazo de la firma
  const firmaWidth = width * 0.115;   // ~96 pt de ancho
  const firmaHeight = height * 0.048; // ~28 pt de alto

  // Detección automática del diseño de recibo:
  // - 2026-08 en adelante: formato con gráfico y cuadro patronal abajo.
  // - 2026-07 hacia atrás: formato histórico con conceptos hasta el pie.
  const esNuevoFormato = periodo && periodo >= '2026-08';

  const xPos = width * 0.315; // Centrado horizontal en el casillero "FIRMA DEL EMPLEADO"
  const yPos = esNuevoFormato
    ? height * 0.252          // Nuevo (2026-08+): justo sobre la leyenda y encima del bloque patronal
    : height * 0.082;         // Histórico (<= 2026-07): al pie de la hoja

  primeraPagina.drawImage(firmaImg, {
    x: xPos,
    y: yPos,
    width: firmaWidth,
    height: firmaHeight,
  });

  return await pdfDoc.save();
}

    // 2. Renderizar lista de Años
    function renderizarCardsAnios() {
      const contenedor = document.getElementById('contenedorCardsAnios');
      const conteoPorAnio = {};

      todosLosRecibos.forEach(r => {
        let anio = 'Otros';
        if (r.periodo && r.periodo.includes('-')) {
          anio = r.periodo.split('-')[0].trim();
        }
        conteoPorAnio[anio] = (conteoPorAnio[anio] || 0) + 1;
      });

      const aniosOrdenados = Object.keys(conteoPorAnio).sort((a, b) => {
        if (a === 'Otros') return 1;
        if (b === 'Otros') return -1;
        return Number(b) - Number(a);
      });

      document.getElementById('lblTotalAnios').innerText = `${aniosOrdenados.length} EJERCICIOS`;

      if (!anioSeleccionado && aniosOrdenados.length > 0) {
        anioSeleccionado = aniosOrdenados[0];
      }

      contenedor.innerHTML = aniosOrdenados.map(anio => {
        const activeClass = (anioSeleccionado === anio) ? 'active' : '';
        const cantidad = conteoPorAnio[anio];
        return `
          <div class="card-anio ${activeClass}" onclick="seleccionarAnio('${anio}', this)">
            <div class="card-anio-titulo">
              <span>📅</span>
              <span>Año ${anio}</span>
            </div>
            <span class="card-anio-cant">${cantidad}</span>
          </div>
        `;
      }).join('');

      renderizarListaRecibos();
    }

    function seleccionarAnio(anio, elCard) {
      anioSeleccionado = anio;
      document.querySelectorAll('.card-anio').forEach(c => c.classList.remove('active'));
      if (elCard) elCard.classList.add('active');
      renderizarListaRecibos();
    }

    // 3. Renderizar Recibos como Cards Suaves
    function renderizarListaRecibos() {
      const container = document.getElementById('contenedorRecibosLista');
      const lblTitulo = document.getElementById('lblTituloEjercicio');
      const lblContador = document.getElementById('lblContadorFiltrados');

      lblTitulo.innerHTML = `📁 Recibos · <b>Año ${anioSeleccionado}</b>`;

      const filtrados = todosLosRecibos.filter(r => {
        if (anioSeleccionado === 'Otros') {
          return !r.periodo || !r.periodo.includes('-');
        }
        return r.periodo && r.periodo.startsWith(anioSeleccionado);
      });

      lblContador.innerText = `${filtrados.length} recibos encontrados`;

      if (filtrados.length === 0) {
        container.innerHTML = `<div class="empty-state">No hay recibos registrados en el año ${anioSeleccionado}.</div>`;
        return;
      }

      container.innerHTML = filtrados.map(r => {
        let nombrePeriodo = r.periodo;
        if (r.periodo && r.periodo.includes('-')) {
          const [anio, mesNum] = r.periodo.split('-');
          const indice = parseInt(mesNum, 10) - 1;
          if (indice >= 0 && indice < 12) {
            nombrePeriodo = `${NOMBRES_MESES[indice]} ${anio}`;
          }
        }

        const legajoMostrar = r.legajo || sesionActual.legajo || '—';
        const estaFirmado = !!r.firmado;

        const badgeFirma = estaFirmado
          ? `<span class="badge-firmado">✓ Firmado</span>`
          : `<span class="badge-pendiente">⏳ Pendiente firma</span>`;

        return `
          <div class="recibo-card-item">
            <div class="recibo-datos-izq">
              <div class="recibo-mes-nombre">${nombrePeriodo}</div>
              <div class="recibo-meta-flex">
                <span class="badge-legajo">Legajo #${legajoMostrar}</span>
                <span class="badge-periodo-sub">Período: ${r.periodo}</span>
                ${badgeFirma}
              </div>
            </div>

            <div class="recibo-acciones-der">
              <button class="btn-action btn-ver" onclick="solicitarFirmaOEjecutar('ver', '${r.id}', '${r.pdf_path}', '${r.periodo}', ${estaFirmado})">
                👁️ Ver
              </button>
              <button class="btn-action btn-descargar" onclick="solicitarFirmaOEjecutar('descargar', '${r.id}', '${r.pdf_path}', '${r.periodo}', ${estaFirmado})">
                ⬇️ Descargar
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 4. Interceptor de Firma
    function solicitarFirmaOEjecutar(tipo, reciboId, pdfPath, periodo, firmado) {
      operacionPendiente = { tipo, reciboId, pdfPath, periodo, firmado };

      // Si ya está firmado, ejecuta directamente la acción sin pedir firma
      if (firmado) {
        ejecutarAccionFinal();
        return;
      }

      // Si no está firmado, abre el modal de firma
      document.getElementById('lblSubtituloFirma').innerText = `Período: ${periodo} · Legajo: #${sesionActual.legajo || '—'}`;
      document.getElementById('btnConfirmarFirma').innerText = tipo === 'ver' ? "Confirmar y Ver" : "Confirmar y Descargar";
      abrirModalFirma();
    }

    // 5. Canvas Táctil y Mouse
    function inicializarCanvas() {
      canvas = document.getElementById('canvasFirma');
      ctx = canvas.getContext('2d');

      // Mouse
      canvas.addEventListener('mousedown', (e) => iniciarTrazo(e.clientX, e.clientY));
      canvas.addEventListener('mousemove', (e) => moverTrazo(e.clientX, e.clientY));
      window.addEventListener('mouseup', detenerTrazo);

      // Touch (Celulares) con preventDefault para evitar que la pantalla haga scroll al firmar
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          e.preventDefault();
          iniciarTrazo(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          e.preventDefault();
          moverTrazo(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      canvas.addEventListener('touchend', detenerTrazo);
    }

    function ajustarDimensionesCanvas() {
      const box = document.getElementById('canvasBox');
      const rect = box.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      ctx.scale(dpr, dpr);
      ctx.strokeStyle = '#0F172A';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function obtenerCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function iniciarTrazo(x, y) {
      dibujando = true;
      trazoRealizado = true;
      document.getElementById('lblGuiaFirma').style.opacity = '0.2';
      const p = obtenerCoords(x, y);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function moverTrazo(x, y) {
      if (!dibujando) return;
      const p = obtenerCoords(x, y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    function detenerTrazo() {
      if (dibujando) {
        ctx.closePath();
        dibujando = false;
      }
    }

    function limpiarCanvas() {
      const box = document.getElementById('canvasBox');
      const rect = box.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      trazoRealizado = false;
      document.getElementById('lblGuiaFirma').style.opacity = '1';
    }

    function abrirModalFirma() {
      document.getElementById('modalFirma').style.display = 'flex';
      setTimeout(() => {
        ajustarDimensionesCanvas();
        limpiarCanvas();
      }, 50);
    }

    function cerrarModalFirma() {
      document.getElementById('modalFirma').style.display = 'none';
      operacionPendiente = null;
    }

    // 6. Subir Firma a Supabase Storage y Actualizar BD
    // ESTO LO MODIFIQUE: Ahora procesa el PDF, estampa la firma y actualiza el archivo en la nube
async function procesarFirmaYAccion() {
  if (!trazoRealizado) {
    return alert("Por favor realizá tu firma en el recuadro antes de continuar.");
  }

  const btn = document.getElementById('btnConfirmarFirma');
  btn.disabled = true;
  btn.innerText = "Estampando firma...";

  try {
    const { reciboId, periodo, pdfPath } = operacionPendiente;

    // 1. Obtener la firma del canvas en formato PNG
    const blobFirmaPng = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

    // 2. Descargar el archivo PDF original desde Supabase Storage
    const { data: pdfOriginalBlob, error: errDescargaPdf } = await supabaseClient.storage
      .from('recibos')
      .download(pdfPath);

    if (errDescargaPdf) throw new Error("No se pudo obtener el PDF original: " + errDescargaPdf.message);

    // 3. Estampar la firma en el documento PDF
    const pdfBytesFirmado = await estamparFirmaEnPdf(pdfOriginalBlob, blobFirmaPng);
    const pdfBlobFirmado = new Blob([pdfBytesFirmado], { type: 'application/pdf' });

    // 4. Subir la imagen de la firma de respaldo (PNG)
    const firmaStoragePath = `${periodo}/firmas/${sesionActual.dni}_${periodo}.png`;
    await supabaseClient.storage
      .from('recibos')
      .upload(firmaStoragePath, blobFirmaPng, { contentType: 'image/png', upsert: true });

    // 5. Sobrescribir el PDF en Supabase Storage con la versión ya firmada
    const { error: errUploadPdf } = await supabaseClient.storage
      .from('recibos')
      .upload(pdfPath, pdfBlobFirmado, {
        contentType: 'application/pdf',
        upsert: true // Reemplaza el archivo anterior con el firmado
      });

    if (errUploadPdf) throw errUploadPdf;

    // 6. Actualizar registro en la tabla public.recibos
    const { error: errDb } = await supabaseClient
      .from('recibos')
      .update({
        firmado: true,
        fecha_firma: new Date().toISOString(),
        firma_path: firmaStoragePath
      })
      .eq('id', reciboId);

    if (errDb) throw errDb;

    // 7. Sincronizar memoria y refrescar interfaz
    const rLocal = todosLosRecibos.find(r => String(r.id) === String(reciboId));
    if (rLocal) {
      rLocal.firmado = true;
      rLocal.fecha_firma = new Date().toISOString();
    }

    renderizarListaRecibos();
    document.getElementById('modalFirma').style.display = 'none';

    // 8. Abrir o descargar automáticamente el PDF firmado
    ejecutarAccionFinal();

  } catch (err) {
    console.error("Error al procesar la firma en el PDF:", err);
    alert("Ocurrió un error al firmar el recibo: " + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "Confirmar y Continuar";
  }
}

    function ejecutarAccionFinal() {
      if (!operacionPendiente) return;
      const { tipo, pdfPath, periodo } = operacionPendiente;

      if (tipo === 'ver') {
        verRecibo(pdfPath);
      } else if (tipo === 'descargar') {
        descargarRecibo(pdfPath, periodo);
      }
      operacionPendiente = null;
    }

    // 7. Visualizar PDF
    async function verRecibo(pdfPath) {
      try {
        const { data, error } = await supabaseClient.storage
          .from('recibos')
          .createSignedUrl(pdfPath, 3600);

        if (error) throw error;
        if (data && data.signedUrl) {
          window.open(data.signedUrl, '_blank');
        }
      } catch (err) {
        alert("No se pudo previsualizar el recibo: " + err.message);
      }
    }

    // 8. Descargar PDF
    async function descargarRecibo(pdfPath, periodo) {
      try {
        const { data, error } = await supabaseClient.storage
          .from('recibos')
          .download(pdfPath);

        if (error) throw error;

        const blobUrl = URL.createObjectURL(data);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `Recibo_${periodo}_${sesionActual.dni}.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

      } catch (err) {
        alert("Error al descargar el archivo: " + err.message);
      }
    }

    function cerrarSesion() {
      localStorage.removeItem('operario_sesion');
      window.location.href = 'index.html';
    }
  </script>
