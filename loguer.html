<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co;" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Operarios · Recibos de Sueldo</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <!-- Supabase CDN para compatibilidad tanto en Electron como en Web/GitHub Pages -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --color-bg: #F3F5F1;
      --color-surface: #FFFFFF;
      --color-plant: #1E6B4C;
      --color-plant-dark: #123F2C;
      --color-plant-soft: rgba(30, 107, 76, 0.08);
      --color-text: #1B231D;
      --color-text-secondary: #6B7280;
      --color-border: #E5E7EB;
      --radius-card: 20px;
      --radius-input: 12px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Roboto', sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: repeating-linear-gradient(100deg, rgba(30, 107, 76, 0.035) 0px, rgba(30, 107, 76, 0.035) 1.5px, transparent 1.5px, transparent 38px);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: 38px 32px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .logo-img {
      max-width: 130px;
      height: auto;
      margin-bottom: 18px;
      object-fit: contain;
    }

    .login-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--color-plant-dark);
      margin: 0 0 6px;
      letter-spacing: -0.3px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin: 0 0 26px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.4px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: var(--radius-input);
      border: 1.5px solid var(--color-border);
      background: #FAFAF9;
      color: var(--color-text);
      outline: none;
      transition: all 0.2s ease;
      text-align: center;
    }

    .form-input:focus {
      border-color: var(--color-plant);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px var(--color-plant-soft);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--color-plant);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-input);
      font-size: 13.5px;
      font-weight: 800;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(30, 107, 76, 0.25);
    }

    .btn-login:hover {
      background: var(--color-plant-dark);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: scale(0.98);
      background-color: #FFFDE7 !important;
      border: 1px solid #FBC02D !important;
      color: #D97706 !important;
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .alert-box {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: var(--radius-input);
      font-size: 12px;
      font-weight: 600;
      display: none;
      text-align: center;
    }
    .alert-error {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <img src="logo.png" alt="Logo Empresa" class="logo-img" onerror="this.style.display='none'">
      <h2 class="login-title">Portal de Recibos</h2>
      <p class="login-subtitle">Ingresá tu DNI para consultar tus recibos de sueldo.</p>

      <form id="formLogin" onsubmit="validarIngreso(event)">
        <div class="form-group">
          <label for="inputDni">Documento Nacional de Identidad</label>
          <input 
            type="tel" 
            id="inputDni" 
            class="form-input" 
            placeholder="Sin puntos ni espacios" 
            maxlength="9" 
            required 
            autofocus
          />
        </div>

        <button type="submit" class="btn-login" id="btnLogin">INGRESAR</button>
      </form>

      <div id="alertaMsg" class="alert-box alert-error"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zsgqlmfzidazdtpgmuna.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZ3FsbWZ6aWRhemR0cGdtdW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMTY3NDIsImV4cCI6MjA5Nzc5Mjc0Mn0.Y9dDHLdQGIOcVS3JaYnbUHWlwul4uiEkkb7udeoF-b0';

    // ESTO LO MODIFIQUE: Se renombra la variable a supabaseClient para no colisionar con la librería global
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function validarIngreso(e) {
      e.preventDefault();
      const dniVal = document.getElementById('inputDni').value.trim().replace(/\D/g, '');
      const btn = document.getElementById('btnLogin');
      const alerta = document.getElementById('alertaMsg');

      alerta.style.display = 'none';

      if (!dniVal || dniVal.length < 7) {
        mostrarAlerta("Ingresá un número de DNI válido.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "VERIFICANDO...";

      try {
        const { data, error } = await supabaseClient
          .from('recibos')
          .select('dni, empleado, legajo')
          .eq('dni', parseInt(dniVal, 10))
          .limit(1);

        if (error) throw error;

        if (!data || data.length === 0) {
          mostrarAlerta("DNI no registrado o sin recibos disponibles actualmente.");
          btn.disabled = false;
          btn.innerText = "INGRESAR";
          return;
        }

        const sesion = {
          dni: data[0].dni,
          empleado: data[0].empleado || 'Operario',
          legajo: data[0].legajo || '—'
        };

        localStorage.setItem('operario_sesion', JSON.stringify(sesion));
        window.location.href = 'panel.html';

      } catch (err) {
        console.error("Error validando DNI:", err);
        mostrarAlerta("Error al conectar con el servidor. Reintentá.");
        btn.disabled = false;
        btn.innerText = "INGRESAR";
      }
    }

    function mostrarAlerta(msg) {
      const alerta = document.getElementById('alertaMsg');
      alerta.innerText = msg;
      alerta.style.display = 'block';
    }
  </script>
</body>
</html>
